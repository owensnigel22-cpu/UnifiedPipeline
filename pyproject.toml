[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keylab"
# The version is read from keylab.__version__ (single source of truth).
dynamic = ["version"]
description = "Constrained key recovery and cryptographic research utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pycryptosat>=5.11"
]

[project.optional-dependencies]
# Lint, type-check, and coverage tools are pinned so local runs and CI agree;
# bump them in a dedicated PR (Dependabot proposes updates).
dev = ["hypothesis>=6.100", "mypy==2.4.1", "pytest>=8.0", "pytest-cov==7.1.0", "ruff==0.17.3"]
dashboard = ["pandas>=2.0", "pandas-stubs>=2.0", "streamlit>=1.40"]
crypto = ["cryptography>=44.0"]
crypto-alt = ["pycryptodome>=3.23"]
secp256k1 = ["coincurve>=19.0.1,<20.0"]
ecc-alt = ["fastecdsa>=3.0"]
number-theory = ["gmpy2>=2.2"]
sat-native = ["python-sat>=1.8.dev20", "pycosat>=0.6.6"]
sat-certified = ["cdclkit>=0.1.3"]
llm = ["openai>=1.0"]
performance = ["cryptography>=44.0", "coincurve>=19.0.1,<20.0", "gmpy2>=2.2", "python-sat>=1.8.dev20"]
all-backends = [
    "cryptography>=44.0",
    "pycryptodome>=3.23",
    "coincurve>=19.0.1,<20.0",
    "fastecdsa>=3.0",
    "gmpy2>=2.2",
    "python-sat>=1.8.dev20",
    "pycosat>=0.6.6",
    "cdclkit>=0.1.3",
]

[project.scripts]
keylab = "keylab.cli:main"
keylab-advanced = "keylab.advanced_suite:main"

[tool.setuptools.dynamic]
version = { attr = "keylab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Leaked files, sockets, or database connections fail the suite instead of passing silently.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["keylab"]

[tool.coverage.report]
# Floor enforced in CI's full-extras job; raise it as coverage improves.
fail_under = 79
precision = 2
show_missing = true
skip_covered = true
