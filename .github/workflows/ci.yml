name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The secp256k1 extra installs coincurve (libsecp256k1) so the differential
      # tests in tests/test_ecc_differential.py run instead of skipping.
      - run: python -m pip install -e ".[dev,secp256k1]"
      - name: Require the libsecp256k1 reference backend
        run: |
          python -c "import coincurve; print('coincurve', coincurve.PrivateKey(b'\x01' * 32).public_key.format().hex())"
      # The SAT tests call an external solver executable (keylab.sat.solver.find_solver);
      # cryptominisat5 satisfies both the generic and the CryptoMiniSat-specific tests.
      - name: Install the CryptoMiniSat solver
        run: |
          sudo apt-get update
          sudo apt-get install -y cryptominisat
          command -v cryptominisat5
      - run: ruff check .
      - run: pytest -rs
